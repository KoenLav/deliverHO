# Fly.io configuration for the DEMO instance.
#
# Generated by `fly launch`, then corrected. Two things the generator got wrong
# for this app, both worth keeping an eye on if it is ever regenerated:
#
#   1. internal_port defaulted to 8080. This app listens on PORT (3000), so
#      Fly would route to a port nothing answers on and the health check would
#      fail the deploy.
#   2. It strips comments, including the ones explaining why the settings below
#      are what they are.
#
# Amsterdam region, deliberately: this is AVG Article 9 territory even with
# synthetic data, and the hosting precedent is one of the things a gemeente or
# a DPO will ask about. Starting in the EU costs nothing; moving later does.
#
# NO SECRETS IN THIS FILE. It is committed. PSEUDONYM_KEY, DEMO_ACCESS_USER and
# DEMO_ACCESS_PASSWORD are set with `fly secrets set` -- see docs/deployment.md.

app = 'deliverho'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DEPLOY_MODE = 'demo'
  # Served openly on purpose. Safe only because this instance carries nothing
  # but synthetic data and persists nothing -- if that ever stops being true,
  # this comes out before the data goes in.
  DEMO_PUBLIC = '1'
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  PORT = '3000'
  # Fly terminates TLS and forwards the client address, so rate limiting keys
  # on the visitor rather than treating the whole internet as one proxy.
  TRUST_PROXY = '1'

[http_service]
  # Must match PORT above. See note 1 at the top of this file.
  internal_port = 3000
  force_https = true
  # Scales to zero when idle. The store is in-memory, so a demo that has slept
  # comes back freshly seeded -- which suits a demo and reinforces the point
  # that nothing here is persisted.
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    # Deliberately outside the basic-auth curtain so this check can pass.
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
