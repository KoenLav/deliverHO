# fly.toml app configuration file generated for deliverho on 2026-09-12T13:11:14Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'deliverho'
primary_region = 'ams'

[build]
  dockerfile = 'Dockerfile'

[env]
  DEPLOY_MODE = 'demo'
  HOST = '0.0.0.0'
  LOG_LEVEL = 'info'
  PORT = '3000'
  TRUST_PROXY = '1'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '256mb'
