# Manual deploy of the DEMO instance to Fly.io.
#
# workflow_dispatch only -- deliberately not on push. Nothing about this project
# should reach a public URL because someone merged a branch.
name: Deploy demo to Fly.io

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "demo" to confirm this deploys the gated demo instance'
        required: true
        type: string

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    concurrency: fly-deploy-demo
    steps:
      - name: Check confirmation
        if: inputs.confirm != 'demo'
        run: |
          echo "::error::Confirmation did not match. Type 'demo' to proceed."
          exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      # A deploy that ships failing code to a URL someone is about to review is
      # worse than no deploy.
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      # Fly's GitHub integration creates the app and pushes a branch, but does
      # not set this secret. Without the check, the failure surfaces as
      # "no access token available. Please login with 'flyctl auth login'",
      # which sounds like a flyctl problem rather than a missing secret.
      - name: Check Fly token is present
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::FLY_API_TOKEN repository secret is not set."
            echo "Create a scoped token with:  fly tokens create deploy"
            echo "Then add it at:  https://github.com/${{ github.repository }}/settings/secrets/actions"
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The app refuses to boot without PSEUDONYM_KEY (src/config.ts), so
      # provision it here rather than make it a separate manual round trip.
      # An existing value is never overwritten -- rotating it would orphan
      # every administration pseudonym already issued.
      - name: Ensure app secrets exist
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          existing=$(flyctl secrets list -a deliverho --json 2>/dev/null || echo '[]')

          if echo "$existing" | grep -q '"PSEUDONYM_KEY"'; then
            echo "PSEUDONYM_KEY already present; leaving it untouched."
          else
            flyctl secrets set -a deliverho --stage \
              PSEUDONYM_KEY="$(openssl rand -hex 32)"
          fi

          # This instance is public by design (DEMO_PUBLIC=1 in fly.toml), and
          # the gate stays active for as long as credentials exist, so any
          # left over from an earlier gated deploy have to go.
          for key in DEMO_ACCESS_USER DEMO_ACCESS_PASSWORD; do
            if echo "$existing" | grep -q "\"$key\""; then
              echo "Removing $key -- this deploy is public."
              flyctl secrets unset -a deliverho --stage "$key"
            fi
          done

      - name: Deploy
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      # `fly apps create` does not allocate an IP -- only `fly launch` does --
      # so an app created any other way deploys successfully and then fails to
      # resolve. Allocating is idempotent; the shared v4 address is free.
      - name: Ensure a public IP is allocated
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -uo pipefail
          if [ -z "$(flyctl ips list -a deliverho 2>/dev/null | grep -E 'v4|v6')" ]; then
            echo "No address allocated. Allocating."
            flyctl ips allocate-v6 -a deliverho || true
            flyctl ips allocate-v4 --shared -a deliverho || true
          fi
          flyctl ips list -a deliverho

      # Proves the service answers and that the basic-auth curtain is gone.
      - name: Verify it is live and public
        run: |
          set -euo pipefail
          base="https://deliverho.fly.dev"

          # DNS for a freshly allocated address takes a moment to propagate, and
          # curl's --retry does not retry a name-resolution failure.
          for attempt in $(seq 1 24); do
            if getent hosts deliverho.fly.dev >/dev/null 2>&1; then
              echo "deliverho.fly.dev resolves (attempt $attempt)"
              break
            fi
            [ "$attempt" = "24" ] && { echo "::error::deliverho.fly.dev never resolved"; exit 1; }
            sleep 5
          done

          health=$(curl -sS -o /dev/null -w '%{http_code}' --retry 6 --retry-all-errors \
                        --retry-delay 5 --max-time 30 "$base/health")
          echo "GET /health -> $health"
          [ "$health" = "200" ] || { echo "::error::Health check returned $health"; exit 1; }

          # /me/offers answers 401 either way -- from the basic-auth curtain, or
          # from the app's own actor check once you are past it. The difference
          # is the WWW-Authenticate header and the error code, so assert on
          # those rather than on the status, which would pass while gated.
          headers=$(curl -sS -D - -o /tmp/body.json --max-time 30 "$base/me/offers")
          body=$(cat /tmp/body.json)
          echo "$headers" | head -1
          echo "body -> $body"

          if echo "$headers" | grep -qi '^www-authenticate:'; then
            echo "::error::A basic-auth curtain is still up; this deploy was meant to be public."
            exit 1
          fi
          case "$body" in
            *worker_auth_required*) echo "Reached the app directly: no curtain." ;;
            *access_gate*) echo "::error::Still behind the access gate."; exit 1 ;;
            *) echo "::error::Unexpected response from /me/offers: $body"; exit 1 ;;
          esac

          mode=$(echo "$headers" | grep -i '^x-deliverho-mode:' | tr -d '\r')
          echo "$mode"
          echo "$mode" | grep -qi 'demo' || { echo "::error::Instance is not in demo mode"; exit 1; }

          root=$(curl -sS -o /tmp/root.html -w '%{http_code}' --max-time 30 "$base/")
          echo "GET / -> $root"
          [ "$root" = "200" ] || { echo "::error::Demo page returned $root"; exit 1; }
          grep -q 'deliverHO' /tmp/root.html || { echo "::error::Root did not serve the demo page"; exit 1; }
          engine=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 30 "$base/engine.js")
          echo "GET /engine.js -> $engine"
          [ "$engine" = "200" ] || { echo "::error::Engine bundle returned $engine"; exit 1; }

          robots=$(curl -sS --max-time 30 "$base/robots.txt")
          echo "robots.txt -> $robots"
          echo "$robots" | grep -q 'Disallow: /' || { echo "::error::robots.txt is not disallowing crawlers"; exit 1; }

          {
            echo "## Live and public"
            echo
            echo "- $base — the clickable demo, no password"
            echo "- $base/health — 200"
            echo "- No basic-auth prompt; open to anyone with the link"
            echo "- Still \`noindex\` and \`Disallow: /\`, so it stays out of search results"
            echo "- Demo mode: synthetic data, nothing persisted"
          } >> "$GITHUB_STEP_SUMMARY"
